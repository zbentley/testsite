<html>
  <body>
    <script>
      (async () => {
        const res = await fetch(`https://api.github.com/repos/zbentley/testsite/git/trees/main?recursive=1`);
        const data = await res.json();

        const files = data.tree
          .filter(item => item.type === 'blob')
          .sort((a, b) => a.path.localeCompare(b.path));

        let html = '<ul>';
        for (const file of files) {
          html += `<li><a href="${encodeURI(file.path)}">${file.path}</a></li>`;
        }
        html += '</ul>';

        document.getElementsByTagName('body')[0].innerHTML = html;
      })();
    </script>
  </body>
</html>
